exclude: ^(coverage|node_modules|dist|build|\.cache)/
repos:
  - repo: https://github.com/semgrep/pre-commit
    rev: 'v1.181.0'
    hooks:
      - id: semgrep
        args: [
          '--config', 'auto',
          '--config', 'p/secrets',
          '--error',
          '--skip-unknown-extensions'
        ]